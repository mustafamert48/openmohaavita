// OpenMoHAA PS Vita — v0.0.2-vita.1 tested hardware baseline
// Appended to app0:/main/autoexec.cfg by CI so these final values override
// historical bring-up / diagnostic blocks above them.
// Validated on real PS Vita hardware, 2026-08-22.

// Balanced LOD / texture quality
set r_lodbias 1
set r_subdivisions 16
set r_lodCurveError 250
set r_picmip 2

// Expensive / currently problematic effects disabled
set r_dynamiclight 0
set r_flares 0
set cg_shadows 0
set r_shadows 0
set r_drawfog 0

// Known-good Vita renderer path
set r_vita_force_mtex 1
set r_ext_multitexture 1
set r_vertexLight 0
set r_lightmap 0

// Full sky path is currently broken on Vita; fast sky is the stable workaround
set r_fastsky 1

// Stable frame pacing target
set com_maxfps 30
