name: Build PS Vita VPK

on:
  push:
    branches: [vita-port, chatgpt-vita-build, chatgpt-vita-build2]
  pull_request:
    branches: [vita-port]
  workflow_dispatch:

jobs:
  vita:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex cmake ninja-build pkg-config curl bzip2

      - name: Bootstrap VitaSDK
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/vitasdk/vdpm/v0.1.1/bootstrap-vitasdk.sh -o /tmp/bootstrap-vitasdk.sh
          chmod +x /tmp/bootstrap-vitasdk.sh
          VITASDK="$HOME/vitasdk" /tmp/bootstrap-vitasdk.sh
          echo "VITASDK=$HOME/vitasdk" >> "$GITHUB_ENV"
          echo "$HOME/vitasdk/bin" >> "$GITHUB_PATH"

      - name: Install Vita libraries
        shell: bash
        run: |
          export VITASDK="$HOME/vitasdk"
          export VDPM_NONINTERACTIVE=1
          "$VITASDK/bin/vdpm" install \
            zlib bzip2 libpng libjpeg-turbo sdl2 openal-soft openssl curl \
            libogg libvorbis opus opusfile libmad libmathneon vitaShaRK vitaGL \
            SceShaccCgExt kubridge taihen vita-rss-libdl

      - name: Add empty librt compatibility archive
        shell: bash
        run: |
          export VITASDK="$HOME/vitasdk"
          printf 'void __vita_librt_stub(void) {}\n' > /tmp/librt_stub.c
          "$VITASDK/bin/arm-vita-eabi-gcc" -c /tmp/librt_stub.c -o /tmp/librt_stub.o
          "$VITASDK/bin/arm-vita-eabi-ar" rcs "$VITASDK/arm-vita-eabi/lib/librt.a" /tmp/librt_stub.o

      - name: Configure
        shell: bash
        run: |
          export VITASDK="$HOME/vitasdk"
          cmake -S . -B build-vita \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build VPK
        shell: bash
        run: |
          export VITASDK="$HOME/vitasdk"
          cmake --build build-vita -j2
          test -f build-vita/OpenMoHAA.vpk
          ls -lh build-vita/OpenMoHAA.vpk

      - name: Symbolize uploaded Vita crash offsets
        shell: bash
        run: |
          export VITASDK="$HOME/vitasdk"
          echo '=== candidate Vita module files ==='
          find build-vita -type f \( -name '*.elf' -o -name '*.velf' -o -name '*.suprx' -o -name 'cgame*' -o -name 'game*' \) -print | sort
          CGAME="$(find build-vita -type f -name 'cgame.elf' -print -quit)"
          if [ -z "$CGAME" ]; then
            CGAME="$(find build-vita -type f -name '*cgame*.elf' -print -quit)"
          fi
          if [ -z "$CGAME" ]; then
            echo 'cgame ELF not found; listing likely files'
            find build-vita -type f | grep -Ei 'cgame|game.*elf|\.velf$|\.suprx$' || true
            exit 0
          fi
          echo "CGAME=$CGAME"
          echo '=== ELF program headers ==='
          "$VITASDK/bin/arm-vita-eabi-readelf" -l "$CGAME" || true
          echo '=== symbols for crash PC/LR offsets ==='
          for A in 0x5dce6 0x5dce4 0x1dd95 0x1dd94; do
            echo "--- $A ---"
            "$VITASDK/bin/arm-vita-eabi-addr2line" -a -f -C -e "$CGAME" "$A" || true
          done
          echo '=== nearest symbols ==='
          "$VITASDK/bin/arm-vita-eabi-nm" -n -C "$CGAME" | tail -n +1 > /tmp/cgame-nm.txt || true
          python3 - <<'PY'
          import re
          target = 0x5dce6
          best = None
          try:
              for line in open('/tmp/cgame-nm.txt', errors='replace'):
                  m = re.match(r'^([0-9a-fA-F]+)\s+\S\s+(.*)$', line.rstrip())
                  if not m:
                      continue
                  addr = int(m.group(1), 16)
                  if addr <= target and (best is None or addr > best[0]):
                      best = (addr, m.group(2))
          except FileNotFoundError:
              pass
          print('nearest_to_0x5dce6 =', best, 'delta=', hex(target-best[0]) if best else None)
          PY

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: OpenMoHAA-Vita
          path: build-vita/OpenMoHAA.vpk
          if-no-files-found: error

      - name: Upload Vita debug modules
        uses: actions/upload-artifact@v4
        with:
          name: OpenMoHAA-Vita-Debug
          path: |
            build-vita/**/*.elf
            build-vita/**/*.velf
            build-vita/**/*.suprx
          if-no-files-found: warn
